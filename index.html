<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Creator&#39;s Hub · Turning idealists into builders · Lagos</title>
    <meta
      name="description"
      content="Creator&#39;s Hub turns idealists into builders. Young creatives meet at The First Room, Lagos and online, on 19 December 2026. Free to register. Join us."
    />
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="color-scheme" content="dark light" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Creator&#39;s Hub · Turning idealists into builders · Lagos" />
    <meta
      property="og:description"
      content="Africa does not lack ideas. Creator&#39;s Hub is a community for young African creatives and builders. Creator&#39;s Hub 001: The First Room — Saturday 19 December 2026, 9:00 AM – 3:00 PM (WAT), in Lagos and online. Free registration."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding:2rem;font-family:system-ui,sans-serif;background:#0A0A0A;color:#F5F0E8;min-height:100vh">
        <h1>Creator&#39;s Hub</h1>
        <p>Africa does not lack ideas. It lacks rooms where the people holding them can find each other. We&#39;re building those rooms.</p>
        <p>Creator&#39;s Hub 001: The First Room — Saturday 19 December 2026, 9:00 AM – 3:00 PM (WAT), Lagos, Nigeria and online.</p>
        <p>Please enable JavaScript for the full experience.</p>
      </div>
    </noscript>

    <!--
      Static copies of the site's forms so Netlify Forms can detect them at deploy time.
      The React forms submit to the same form names. Keep field names in sync with
      src/content/forms.ts.
    -->
    <form name="volunteer" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="name" /><input name="email" /><input name="phone" /><input name="team" /><input name="second_team" /><input name="attendance" /><textarea name="experience"></textarea><input name="briefing" /><input name="bot-field" />
    </form>
    <form name="partnership" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="name" /><input name="organisation" /><input name="email" /><input name="type" /><textarea name="message"></textarea><input name="bot-field" />
    </form>
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="name" /><input name="email" /><textarea name="message"></textarea><input name="bot-field" />
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
